{% extends "base.html" %}

{% block title %}Form - Form.io Application{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
    }
    .form-card {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .formio-component {
        margin-bottom: 20px;
    }
    .submission-message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 4px;
    }
    .submission-message.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .submission-message.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card form-card">
        <div class="card-body p-5">
            <h2 class="card-title mb-4">Form</h2>
            <div id="formio-form"></div>
            <div id="submissionMessage" class="submission-message d-none"></div>
        </div>
    </div>
</div>

<!-- Include AI Chat Assistant -->
{% include 'ai_chat_sidebar.html' %}
{% endblock %}

{% block extra_js %}
<script>
    const formSchema = {{ form_schema | safe }};

    // Initialize the form renderer
    function initializeForm() {
        Formio.createForm(
            document.getElementById('formio-form'),
            formSchema
        ).then(function(form) {
            window.formInstance = form;
            
            // Handle form submission
            form.on('submit', function(submission) {
                console.log('Form submitted:', submission.data);
                
                // Send submission to server
                fetch('/api/submissions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(submission.data),
                })
                .then(response => response.json())
                .then(data => {
                    showMessage('Form submitted successfully!', 'success');
                    console.log('Server response:', data);
                    
                    // Reset form after successful submission
                    setTimeout(() => {
                        form.reset();
                        clearMessage();
                    }, 2000);
                })
                .catch(error => {
                    console.error('Error submitting form:', error);
                    showMessage('Error submitting form', 'error');
                });
            });

            console.log('Form initialized');
        }).catch(function(err) {
            console.error('Failed to initialize form:', err);
            showMessage('Failed to load form', 'error');
        });
    }

    function showMessage(message, type) {
        const messageDiv = document.getElementById('submissionMessage');
        messageDiv.textContent = message;
        messageDiv.className = `submission-message ${type}`;
    }

    function clearMessage() {
        const messageDiv = document.getElementById('submissionMessage');
        messageDiv.className = 'submission-message d-none';
    }

    // Initialize form on page load
    document.addEventListener('DOMContentLoaded', function() {
        initializeForm();
    });
</script>
{% endblock %}
